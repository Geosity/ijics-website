name: Deploy IJICS website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Refresh official article usage metrics
        run: node demo/tools/refresh-article-metrics.mjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
