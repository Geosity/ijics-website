<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071726"/>
      <stop offset="0.58" stop-color="#12313a"/>
      <stop offset="1" stop-color="#071726"/>
    </linearGradient>
    <radialGradient id="green">
      <stop offset="0" stop-color="#1ca985" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1ca985" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange">
      <stop offset="0" stop-color="#d47b2e" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d47b2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#b9d9e7" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <clipPath id="logoClip"><rect x="100" y="285" width="880" height="650" rx="28"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000510" flood-opacity=".40"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="115" cy="290" r="540" fill="url(#green)"/>
  <circle cx="965" cy="1550" r="580" fill="url(#orange)"/>
  <path d="M-80 1370 C250 1210 450 1430 720 1280 S1120 1090 1230 1190" fill="none" stroke="#9bcde8" stroke-opacity=".15" stroke-width="2"/>
  <path d="M-80 1418 C250 1258 450 1478 720 1328 S1120 1138 1230 1238" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <g filter="url(#shadow)">
    <rect x="100" y="285" width="880" height="650" rx="28" fill="#14343b"/>
  </g>
  <g clip-path="url(#logoClip)">
    <image x="125" y="340" width="830" height="540" preserveAspectRatio="xMidYMid meet" xlink:href="ijics-logo-symbol-clean.png"/>
  </g>

  <text x="540" y="1035" text-anchor="middle" fill="#e7b268" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="4.5">SUBMIT YOUR AMAZING WORK</text>
  <rect x="164" y="1080" width="752" height="2" fill="#d9e8ef" fill-opacity=".32"/>
  <text x="540" y="1178" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="400" letter-spacing="1.8">THE INTERNATIONAL JOURNAL OF</text>
  <text x="540" y="1266" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="1.4">INTELLIGENT CONTROL</text>
  <text x="540" y="1346" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="1.4">AND SYSTEMS</text>
  <rect x="390" y="1430" width="300" height="4" rx="2" fill="#c98b43"/>
  <text x="540" y="1523" text-anchor="middle" fill="#a8c5d2" font-family="Arial, Helvetica, sans-serif" font-size="31" letter-spacing="3">WWW.IJICS.CN</text>
</svg>
